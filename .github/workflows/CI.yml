#goal - i have to build test the code for backend, frontend, then push the image to docker hub
name: CI

on: 
  workflow_dispatch: 
   
jobs:
  code:
       runs-on: ubuntu-latest
       steps:
       #this will automatically clone the code of the current branch into the runner
          - name: Checkout/clone the code
            uses: actions/checkout@v7
          - name: set up python
            uses: action/setup-python@v5
            with:
              python-version: '3.14'
          
            #this step will install the lingting tool
          - name: install linter
            run: pip install ruff
#this step will run the linter
          - name: check the file for linting
            run: ruff check . 
  build_and_push:
    runs-on: ubuntu-latest
    steps:
       - name: Checkout code
         uses: actions/checkout@v4  # Fixed typo: changed 'action' to 'actions'
         
       - name: Login to Docker Hub
         uses: docker/login-action@v3
         with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

       # Step 2 Implementation: Dynamically lowercase the username and set the final tag
       - name: Set lowercased Docker Hub image tag
         run: |
           # Take the Docker username, push it through 'tr' to make it lowercase, and combine with image name
           LOWER_TAG=$(echo "${{ vars.DOCKER_USERNAME }}/app-master:latest" | tr '[:upper:]' '[:lower:]')
           
           # Save this variable into the GitHub Environment file so subsequent steps can use it
           echo "DOCKER_IMAGE_TAG=$LOWER_TAG" >> $GITHUB_ENV

       - name: Build and push
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: ${{ env.DOCKER_IMAGE_TAG }} # Uses the sanitized, lowercase tag here
